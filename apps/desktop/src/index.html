<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>全网视频素材智能搜索助手</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="toolbar">
        <h1>全网视频素材智能搜索助手</h1>
        <div class="toolbar-status">
          <span class="badge">阶段1 补强</span>
          <span class="api-pill" id="api-pill">API 检查中</span>
        </div>
      </section>

      <section class="search-panel">
        <textarea id="query" placeholder="输入画面描述、关键词、台词或 URL">极端高温废墟里，一个男人翻找垃圾，最后发现一台旧空调。</textarea>
        <div class="controls">
          <label><input type="checkbox" value="web-search" checked /> 公开网页</label>
          <label><input type="checkbox" value="bilibili" checked /> B站样本</label>
          <button id="search">开始搜索</button>
        </div>
      </section>

      <section class="workspace-row">
        <div class="panel">
          <h2>项目</h2>
          <div class="inline-form">
            <input id="project-name" placeholder="项目名" value="测试素材项目" />
            <button id="create-project">创建</button>
          </div>
          <select id="project-select" aria-label="项目列表"></select>
        </div>
        <div class="panel">
          <h2>导出</h2>
          <div class="export-actions">
            <button data-export="csv">CSV</button>
            <button data-export="json">JSON</button>
            <button data-export="md">Markdown</button>
          </div>
        </div>
      </section>

      <section class="panel library-panel">
        <div class="panel-title-row">
          <h2>项目素材</h2>
          <button id="refresh-library">刷新素材</button>
        </div>
        <div class="library-tools">
          <label>
            关键词
            <input id="library-keyword" placeholder="搜标题、备注、标签、来源" />
          </label>
          <label>
            类型
            <select id="library-filter">
              <option value="all">全部</option>
              <option value="search_result">搜索收藏</option>
              <option value="frame_match">截图反查</option>
            </select>
          </label>
          <label>
            状态
            <select id="library-review-filter">
              <option value="all">全部</option>
              <option value="pending">待复核</option>
              <option value="confirmed">已确认</option>
              <option value="rejected">已拒绝</option>
            </select>
          </label>
          <label>
            版权
            <select id="library-rights-filter">
              <option value="all">全部</option>
              <option value="unknown">未知</option>
              <option value="cleared">可用</option>
              <option value="needs_permission">需授权</option>
              <option value="blocked">不可用</option>
            </select>
          </label>
          <label>
            排序
            <select id="library-sort">
              <option value="created_desc">最新在前</option>
              <option value="created_asc">最早在前</option>
              <option value="score_desc">匹配分高在前</option>
              <option value="time_asc">时间点早在前</option>
              <option value="time_desc">时间点晚在前</option>
              <option value="title_asc">标题 A-Z</option>
            </select>
          </label>
          <div class="export-actions">
            <button data-library-export="csv">素材CSV</button>
            <button data-library-export="json">素材JSON</button>
            <button data-library-export="md">素材Markdown</button>
          </div>
        </div>
        <div class="library-summary" id="library-summary">等待选择项目</div>
        <div class="library-list" id="library-list"></div>
      </section>

      <section class="panel stage2-panel">
        <h2>截图反查</h2>
        <div class="path-grid">
          <label>
            截图路径
            <input id="image-path" placeholder="例如 E:\搜索插件\tests\fixtures\stage2\stage2-air-query.png" />
          </label>
          <label>
            上传截图
            <input id="image-file" type="file" accept="image/png,image/jpeg,image/webp" multiple />
          </label>
          <div class="dropzone" id="screenshot-dropzone" tabindex="0">
            <strong>拖拽截图</strong>
            <span>可一次多张，也可粘贴剪贴板截图</span>
          </div>
          <label>
            候选视频路径
            <input id="video-path" placeholder="例如 E:\搜索插件\tests\fixtures\stage2\stage2-self-made-testsrc.mp4" />
          </label>
          <label class="wide-field">
            批量候选视频路径
            <textarea id="video-paths" placeholder="每行一个候选视频路径"></textarea>
          </label>
        </div>
        <div class="number-grid">
          <label>
            匹配阈值
            <input id="match-threshold" type="number" min="0" max="1" step="0.01" value="0.75" />
          </label>
          <label>
            粗扫 FPS
            <input id="match-fps" type="number" min="0.1" max="30" step="0.1" value="1" />
          </label>
          <label>
            精排 FPS
            <input id="refine-fps" type="number" min="0.1" max="30" step="0.1" value="4" />
          </label>
          <label>
            精排窗口(ms)
            <input id="refine-window-ms" type="number" min="250" max="10000" step="250" value="1000" />
          </label>
        </div>
        <div class="controls">
          <button id="analyze-image">分析截图</button>
          <button id="upload-image">上传并分析截图</button>
          <button id="find-match">匹配候选视频</button>
          <button id="find-batch-match">批量匹配候选视频</button>
          <button id="find-multi-asset-match">批量截图匹配候选视频</button>
          <button id="save-current-match">收藏当前匹配帧</button>
          <button id="save-high-score-matches">收藏高分匹配</button>
        </div>
        <pre class="stage2-output" id="stage2-output">等待截图分析</pre>
      </section>

      <section class="status" id="status">等待搜索</section>
      <section class="results" id="results"></section>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>
